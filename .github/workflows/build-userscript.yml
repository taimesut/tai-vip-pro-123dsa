name: Build Violentmonkey Userscript

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tùy chọn, ví dụ 0.4.70 (để trống sẽ tự tạo)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-userscript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test userscript
        run: npm run test:userscript

      - name: Resolve version
        id: version
        shell: bash
        run: |
          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            version="$requested"
          else
            version="0.4.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Violentmonkey userscript
        env:
          OPS_FTE_USERSCRIPT_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:userscript

      - name: Verify userscript
        shell: bash
        run: |
          test -f userscript-dist/ops-fte.user.js
          grep -F "// ==UserScript==" userscript-dist/ops-fte.user.js
          grep -F "@version      ${{ steps.version.outputs.version }}" userscript-dist/ops-fte.user.js

      - name: Upload userscript
        uses: actions/upload-artifact@v4
        with:
          name: ops-fte-violentmonkey-${{ steps.version.outputs.version }}
          path: userscript-dist/ops-fte.user.js
          if-no-files-found: error
          retention-days: 30
