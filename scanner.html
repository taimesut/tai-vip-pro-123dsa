<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <title>OPS FTE - Đọc QR từ ảnh</title>
  </head>
  <body>
    <main class="scanner-shell">
      <section class="scanner-card" aria-labelledby="scanner-title">
        <div class="scanner-icon" aria-hidden="true">▦</div>
        <h1 id="scanner-title">Đọc QR / Barcode từ ảnh</h1>
        <p class="scanner-help">
          Chọn ảnh đã chụp trong thiết bị. Trang này không mở camera và không
          quét realtime.
        </p>

        <p id="status" role="status" aria-live="polite">
          Đang chờ kết nối với ứng dụng...
        </p>

        <input id="image-input" type="file" accept="image/*" hidden />

        <div class="actions">
          <button id="select-image" class="primary" type="button" disabled>
            Chọn ảnh để đọc mã
          </button>
          <button id="close" type="button">Đóng</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/scanner.ts"></script>
  </body>
</html>
